[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python",
    "ollama",
    "faiss-cpu",
    "sentence-transformers",
    "datasets",
    "evaluate",
    "huggingface_hub",
    "rank_bm25",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]